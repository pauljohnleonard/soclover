# soclover.drpjl.com → Soclover (Node on 127.0.0.1:3055)
# Installed to /etc/nginx/sites-available/soclover.drpjl.com.conf
# Certbot will add the :443 ssl listen directives.
#
# Requires map $http_upgrade $connection_upgrade (see soclover-websocket-map.conf).

upstream soclover_node {
    server 127.0.0.1:3055;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name soclover.drpjl.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    client_max_body_size 20m;

    location / {
        proxy_pass http://soclover_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
